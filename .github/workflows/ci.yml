name: CI

# Everything that gates a merge. The jobs themselves — Pre-commit, Detect
# changed files, Build and test, Fuzz — are blairham/.github's go-ci.yml,
# shared with every Go repository there; their checks report as
# `CI / <job>`. Repository-specific jobs go below, `needs: ci`, with their
# steps gated on `needs.ci.outputs.code == 'true'` (never a job-level `if:`
# or a `paths:` filter: a required check that never runs is pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '29 5 * * 3'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@3671a608f213410150682190bc5106a45325f214 # main
