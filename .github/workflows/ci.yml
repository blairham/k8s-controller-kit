name: CI

# One workflow holds everything that gates a merge, so there is one file to
# read and one check to require. Splitting pre-commit or the tests into their
# own workflow buys nothing and costs a second place to keep in sync.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-commit is the lint surface: the same pinned golangci hooks run locally
  # as the commit gate and here as the merge gate. No standalone
  # golangci-lint-action — a parallel lint config drifts. It is also the only
  # job that looks at *every* file rather than at Go: trailing whitespace,
  # secrets, conflict markers, the toolchain pin.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # go-mod-tidy-repo resolves the whole graph; uncached it is slow and flaky.
          cache: true
      - name: Run pre-commit hooks
        uses: blairham/go-pre-commit@5788df636d2726ba06d337393503a7fe6b3451c2 # v4.6.7

  # Gating happens inside the jobs, never with a workflow-level `paths:`
  # filter: a required check that never runs reports as *pending forever*
  # rather than as passed, which makes a docs-only pull request unmergeable.
  # Anything unrecognised counts as code, so when this is wrong it is wrong in
  # the direction of running the tests.
  changes:
    name: Detect changed files
    needs: pre-commit
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit, not just HEAD
      - id: filter
        name: Is any of this code?
        env:
          # On a merge to main there is no pull request; `before` is the commit
          # main pointed at, which makes the diff the merge itself.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "push to $GITHUB_REF_NAME — running everything"
            code=true
          elif ! git cat-file -e "$BASE" 2>/dev/null; then
            # No usable base commit — a force push, or a shallow fetch that did
            # not reach it. `git diff` would fail here and print nothing, and an
            # empty diff is indistinguishable from "only prose changed", so this
            # would silently skip every test. The safe answer is to run them.
            echo "base commit $BASE is not present — running everything"
            code=true
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*|*.md|LICENSE|LICENSE.*|*.png|*.jpg|*.gif|*.svg) ;; # prose
                *) code=true; break ;;
              esac
            done <<<"$(git diff --name-only "$BASE"...HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files are $([ "$code" = true ] && echo 'code — full run' || echo 'prose only — skipping the code jobs')"

  test:
    name: Build and test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go build ./...
        if: needs.changes.outputs.code == 'true'
      - run: go test -race ./...
        if: needs.changes.outputs.code == 'true'
