name: Release

# A signed v* tag is still the release — `go get` resolves tags, not GitHub
# releases. This publishes the evidence beside it: the tagged source, a
# cosign-signed checksums.txt, and build provenance tying the archive to this
# workflow run and commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1). Must already exist."
        required: true
        type: string

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestation both sign with the
      # workflow's OIDC identity.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags + history: GoReleaser finds the previous tag

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The tag should only ever point at a commit CI already passed, but a
      # release is the one place a second look costs nothing that matters.
      - name: Run tests
        run: go test -race ./...

      # The notes are the tag's section of CHANGELOG.md, which is written for
      # consumers; a release whose section is missing fails here rather than
      # publishing empty notes.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on                    { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for every file checksums.txt lists. GitHub
      # stores it (`gh attestation verify`), and the bundle is also attached
      # to the release, so it can be checked offline and found by tools that
      # look for an .intoto.jsonl beside the artifacts.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/k8s-controller-kit-$TAG.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/k8s-controller-kit-$TAG.intoto.jsonl" --clobber
