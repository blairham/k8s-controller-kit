name: Release

# A signed v* tag is still the release — `go get` resolves tags, not GitHub
# releases. blairham/.github's go-release.yml publishes the evidence beside
# it: the tagged source (.goreleaser.yaml builds nothing), a cosign-signed
# checksums.txt, and build provenance. The signing identity is go-release.yml
# itself; SECURITY.md shows how to verify it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestation both sign with the
      # workflow's OIDC identity.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
